<div class="container">
  <h1>Forgot Password</h1>
  <form [formGroup]="forgotForm" (ngSubmit)="sendResetLink()">
    <label>Email</label>
    <input type="email"  placeholder="Enter your email"  formControlName="email">
    <button type="submit">Send Reset Link</button>
    <p>Remember your password?<a (click)="goToLogin()">Login</a></p>
  </form>
</div>
