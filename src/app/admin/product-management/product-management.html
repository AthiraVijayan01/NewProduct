<div class="container">

  <h1>Product Management</h1>

  <button class="add-btn" (click)="openModal()">+ Add Product</button>

  <div class="product-grid">
    <div class="product-card" *ngFor="let p of products">

      <img *ngIf="p.image" [src]="p.image" class="product-img">

      <h3>{{ p.name }}</h3>
      <p>{{ p.category }}</p>
      <p class="price">₹{{ p.price }}</p>

      <div class="btn-group">
        <button class="edit-btn" (click)="editProduct(p)">Edit</button>
        <button class="delete-btn" (click)="deleteProduct(p.id)">Delete</button>
      </div>

    </div>
  </div>

</div>

<div class="backdrop" *ngIf="showModal" (click)="closeModal()">

  <div class="modal" (click)="$event.stopPropagation()">

    <h2>{{ isEdit ? 'Update Product' : 'Add Product' }}</h2>

    <input [(ngModel)]="name" placeholder="Product Name">
    <input [(ngModel)]="price" type="number" placeholder="Price">
    <input [(ngModel)]="category" placeholder="Category">

    <input type="file" (change)="onFileSelected($event)">

    <img *ngIf="image" [src]="image" class="preview">

    <div class="actions">
      <button class="save" (click)="saveProduct()">
        {{ isEdit ? 'Update' : 'Save' }}
      </button>
      <button class="cancel" (click)="closeModal()">Cancel</button>
    </div>

  </div>

</div>
