
<div class="bill-container">
  <h2>Payment Bill</h2>

  <table>
    <thead>
      <tr>
        <th>Item</th>
        <th>Category</th>
        <th>Price (₹)</th>
        <th>Quantity</th>
        <th>Total (₹)</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let item of cart">
        <td>{{ item.name }}</td>
        <td>{{ item.category }}</td>
        <td>{{ item.price }}</td>
        <td>{{ item.quantity }}</td>
        <td>{{ item.price * item.quantity }}</td>
      </tr>
    </tbody>
  </table>

  <hr>

  <div class="summary">
    <p><strong>Total Amount:</strong> ₹{{ total }}</p>
    <p><strong>Discount:</strong> ₹{{ discount }}</p>
    <p class="grand"><strong>Grand Total:</strong> ₹{{ grandTotal }}</p>
  </div>

  <div class="buttons">
    <button (click)="confirmPayment()">Confirm Payment</button>
    <button (click)="goBack()">Back to Cart</button>
  </div>
</div>
