<div class="layout">
  <div class="sidebar">
    <h2>Shopiee</h2>
    <button (click)="goToView()">Products</button>
    <button (click)="goToCart()">Cart</button>
    <button (click)="goToProfile()">Profile</button>
    <button class="logout" (click)="logout()">Logout</button>
  </div>
  <div class="content">
    <div class="hero">
      <div class="hero-text">
        <h1>Welcome</h1>
        <p>Explore products and manage your shopping easily.</p>
        <button class="shop-btn" (click)="goToView()">Shop Now</button>
      </div>
      <div class="hero-image">
        <img src="images\logo.png">
      </div>
    </div>
    <h2 class="title">Products</h2>
    <div class="grid">
      <div class="card" *ngFor="let p of productslist">
        <img [src]="p.image || 'assets/default.png'">
        <h3>{{ p.name }}</h3>
        <p class="category">{{ p.category }}</p>
        <div class="bottom">
          <span>₹{{ p.price }}</span>
          <button (click)="goToView()">View</button>
        </div>
      </div>
    </div>
  </div>
</div>
